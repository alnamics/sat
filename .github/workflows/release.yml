name: Release

on:
  release:
    types: [ published ]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set the manifest version
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          manifest=custom_components/sat/manifest.json
          jq --arg version "${VERSION#v}" '.version = $version' "$manifest" > manifest.tmp
          mv manifest.tmp "$manifest"

      - name: Zip the integration
        working-directory: custom_components/sat
        run: zip -r "$GITHUB_WORKSPACE/sat.zip" .

      - name: Upload the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" sat.zip --clobber --repo "$GITHUB_REPOSITORY"
