name: Release from tag

# Pushing a tag such as v5.2.0.5 publishes a release with the sat.zip that HACS downloads.
# A release made by hand in the GitHub UI is handled by release.yml instead; this workflow then
# only makes sure the zip is there.

on:
  push:
    tags: [ "v*" ]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest=custom_components/sat/manifest.json
          jq --arg version "${TAG#v}" '.version = $version' "$manifest" > manifest.tmp
          mv manifest.tmp "$manifest"

      - name: Zip the integration
        working-directory: custom_components/sat
        run: zip -r "$GITHUB_WORKSPACE/sat.zip" .

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          > [!WARNING]
          > **Experimental, AI-written, unverified code. Use at your own risk.**
          > The additions of this fork were written by Claude (an AI model by Anthropic). They pass
          > the automated tests but have not been reviewed by a person or run on a real boiler.
          > Keep a backup and watch your boiler after installing.

          SAT v2 with the MPX additions. Requires Home Assistant 2026.11 or newer.

          Everything new is off, or only informs, until you turn it on. See
          [MPX additions](https://github.com/alnamics/sat/blob/main/docs/mpx.md) for what there is
          and the [README](https://github.com/alnamics/sat#installation) for installing through
          HACS and rolling it out safely.
          EOF

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "${TAG#v} (MPX)" --notes-file notes.md --verify-tag
          fi
          gh release upload "$TAG" sat.zip --clobber --repo "$GITHUB_REPOSITORY"
